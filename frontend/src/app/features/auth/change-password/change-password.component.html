<div class="min-h-screen flex items-center justify-center bg-gray-50">
  <mat-card class="w-full max-w-md p-6 shadow-lg rounded-xl">
    <mat-card-header class="flex justify-center mb-6">
      <mat-card-title class="text-2xl font-bold text-center text-blue-800">Change Password</mat-card-title>
      <mat-card-subtitle class="text-center mt-2">You must change your password on first login</mat-card-subtitle>
    </mat-card-header>
    
    <mat-card-content>
      <div *ngIf="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
        {{ error }}
      </div>
      
      <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Current Password</mat-label>
          <input matInput type="password" formControlName="oldPassword" placeholder="Enter current password">
          <mat-error *ngIf="passwordForm.get('oldPassword')?.hasError('required')">Current password is required</mat-error>
        </mat-form-field>
        
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>New Password</mat-label>
          <input matInput type="password" formControlName="newPassword" placeholder="Enter new password">
          <mat-error *ngIf="passwordForm.get('newPassword')?.hasError('required')">New password is required</mat-error>
          <mat-error *ngIf="passwordForm.get('newPassword')?.hasError('minlength')">Must be at least 6 characters</mat-error>
        </mat-form-field>
        
        <button mat-raised-button color="primary" type="submit" [disabled]="passwordForm.invalid || loading" class="w-full py-2 text-lg">
          {{ loading ? 'Updating...' : 'Change Password' }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
