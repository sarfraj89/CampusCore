<div class="p-0 overflow-hidden rounded-[32px] bg-white border border-slate-200 shadow-2xl w-[500px]">
  <!-- Premium Header -->
  <header class="bg-blue-600 p-8 flex justify-between items-center text-white relative overflow-hidden">
    <div class="absolute top-0 right-0 w-48 h-48 bg-white/10 rounded-full -mr-24 -mt-24 blur-3xl"></div>
    <div class="relative z-10">
      <div class="flex items-center gap-2 mb-2">
        <span class="w-2 h-2 rounded-full bg-blue-300"></span>
        <span class="text-[10px] font-black text-blue-100 uppercase tracking-[0.3em]">Curriculum Management</span>
      </div>
      <h2 class="text-3xl font-black tracking-tight leading-none">
        {{ data.id ? 'Modify Subject' : 'New Subject' }}
      </h2>
    </div>
    <mat-icon class="opacity-30 !text-5xl !w-12 !h-12">auto_stories</mat-icon>
  </header>

  <mat-dialog-content class="!p-8 !m-0">
    <form [formGroup]="form" class="space-y-8">
      
      <mat-form-field appearance="outline" class="w-full h-20">
        <mat-label>Subject Name</mat-label>
        <input matInput formControlName="name" placeholder="e.g. Advanced Data Structures">
        <mat-icon matSuffix class="text-slate-300">menu_book</mat-icon>
      </mat-form-field>

      <div class="grid grid-cols-2 gap-6">
        <mat-form-field appearance="outline" class="w-full h-20">
          <mat-label>Unique Code</mat-label>
          <input matInput formControlName="code" placeholder="e.g. CS101">
          <mat-icon matSuffix class="text-slate-300">tag</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full h-20">
          <mat-label>Credit Units</mat-label>
          <input matInput type="number" formControlName="credits" placeholder="e.g. 4">
          <mat-icon matSuffix class="text-slate-300">star_outline</mat-icon>
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline" class="w-full h-20">
        <mat-label>Responsible Department</mat-label>
        <mat-select formControlName="departmentId">
          <mat-option *ngFor="let dept of departments" [value]="dept.id">
            {{dept.name}}
          </mat-option>
        </mat-select>
        <mat-icon matSuffix class="text-slate-300">account_balance</mat-icon>
      </mat-form-field>
      
    </form>
  </mat-dialog-content>

  <!-- Premium Footer -->
  <mat-dialog-actions class="!p-8 bg-slate-50 border-t border-slate-100 flex justify-end gap-3">
    <button mat-button 
            class="!rounded-2xl font-bold h-12 px-6 text-slate-500 hover:bg-slate-200 transition-all active:scale-95" 
            (click)="onCancel()">
      Cancel
    </button>
    <button mat-flat-button 
            color="primary" 
            class="!rounded-2xl font-black h-12 px-10 shadow-xl shadow-blue-500/30 transition-all active:scale-95" 
            [disabled]="form.invalid" 
            (click)="onSave()">
      {{ data.id ? 'Update Subject' : 'Create Subject' }}
    </button>
  </mat-dialog-actions>
</div>
